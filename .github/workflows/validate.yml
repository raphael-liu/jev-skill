name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m unittest discover -s tests -v
      - run: python skills/jev-skill/scripts/jev.py --request skills/jev-skill/assets/triage.en.json --dry-run
      - run: python skills/jev-skill/scripts/jev.py --request skills/jev-skill/assets/triage.zh-CN.json --dry-run
      - run: python docs/recompute.py > /dev/null
